name: E2E
on: [ workflow_call ]

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: 'bash'

jobs:
  # Playwright + Chromium against the served bundle (no Electron). Kept separate
  # from the Electron suite so the two heavy suites get memory-isolated runners.
  e2e-inspector:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - uses: ./.github/actions/setup
        id: setup
        with:
          cache-playwright: 'true'

      - name: install
        if: steps.setup.outputs.node-modules-cache-hit != 'true'
        run: make install

      # Provides index.html + copied runtime assets; the JS bundle is rebuilt below.
      - uses: ./.github/actions/download-build

      - name: install Playwright browsers
        run: npx playwright install

      # The UI Designer code-mode e2e needs the wasm parser that --production drops, so
      # e2e rebuilds a dev bundle (~74s) instead of reusing download-build's production
      # one. Cache that dev bundle so re-runs and PRs that don't touch inspector/asset-packs
      # source skip the rebuild. The key MUST cover every input that feeds the bundle: a
      # miss is cheap (rebuild below), but a STALE hit would silently serve wrong code to
      # e2e. build.js inlines all assets (dataurl), so bundle.js + bundle.css are the
      # complete output set — no hashed asset files to miss (unlike the past bundle.css bug).
      - name: Cache inspector dev bundle
        id: inspector-dev-bundle
        uses: actions/cache@v4
        with:
          path: |
            packages/inspector/public/bundle.js
            packages/inspector/public/bundle.css
          # Single line on purpose: newlines inside a ${{ }} expression are brittle.
          key: inspector-e2e-devbundle-${{ runner.os }}-${{ hashFiles('packages/inspector/src/**', 'packages/inspector/build.js', 'packages/inspector/bevy-agent-realm.js', 'packages/inspector/package.json', 'packages/asset-packs/src/**', 'packages/asset-packs/package.json', 'package-lock.json') }}

      - name: build inspector
        if: steps.inspector-dev-bundle.outputs.cache-hit != 'true'
        run: cd packages/inspector && node ./build.js

      - name: start inspector server
        shell: bash
        run: |
          cd packages/inspector
          npx http-server public -p 8000 --cors -a localhost &
          sleep 5

      # Machine-level backstop: a re-run is clean (fresh forks + browser per spec
      # file, in-page data layer) and a real regression fails both attempts.
      - name: e2e
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        with:
          timeout_minutes: 20
          max_attempts: 2
          retry_on: error
          shell: 'bash'
          command: make test-inspector-e2e
        env:
          NODE_OPTIONS: "--max-old-space-size=8192"
          E2E_CONTENT_URL: https://builder-items.decentraland.zone

      # Diagnostics for the flaky "app never becomes visible" failure.
      - name: upload e2e diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: inspector-e2e-diagnostics
          path: packages/inspector/test-results
          if-no-files-found: ignore
          retention-days: 3

  # Cold-launches the real Electron app via Playwright _electron (drives the
  # app's own Chromium — no browser download); runs the prebuilt dist.
  e2e-creator-hub:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - uses: ./.github/actions/setup
        id: setup

      - name: install
        if: steps.setup.outputs.node-modules-cache-hit != 'true'
        run: make install
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

      - uses: ./.github/actions/download-build
        with:
          include-creator-hub: 'true'

      - name: e2e
        run: make test-creator-hub-e2e-ci
        env:
          NODE_OPTIONS: "--max-old-space-size=8192"
          E2E_CONTENT_URL: https://builder-items.decentraland.zone
